<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="discription" content="好みのキャストに投票してください">
  <link rel="stylesheet" href="style.css">
  <title>投票</title>
</head>

<body>
  <div id="header">
    <img class="logo" src="https://simulation-ryo.github.io/simulation/vote/img/logo.png" alt="ロゴ">
    <h1 class="header-text">にゃんにゃんメイドカフェ</h1>
  </div>
  
  <div class="header-img-cntainer">
    <img class="header-img" src="https://simulation-ryo.github.io/simulation/vote/img/header.png" alt="仮ヘッダー画像">
  </div>
  
  <div class="g-nav">
    <nav>
      <ul>
        <li>
          <a href="https://simulation-ryo.github.io/simulation/vote/index.html">
            <span class="g-nav_icon">
              <img src="https://simulation-ryo.github.io/simulation/vote/img/home.png" alt="">
            </span>
            <span class="g-nav_text">ホーム</span>
          </a>
        </li>
        <li>
          <a href="https://simulation-ryo.github.io/simulation/vote/ranking/main.html">
            <span class="g-nav_icon">
              <img src="https://simulation-ryo.github.io/simulation/vote/img/ranking.png" alt="">
            </span>
            <span class="g-nav_text">ランキング</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
  
  <main>
    <div class="cast-list">
      <div class="cast" data-name="c言語">
        <img src="img/C.png" alt="c言語のアイコン">
        <p class="icon-discription">C言語</p>
      </div>
      
      <div class="cast" data-name="HTML">
        <img src="img/HTML.png" alt="HTMLのアイコン">
        <p class="icon-discription">HTML</p>
      </div>
      
      <div class="cast" data-name="Java">
        <img src="img/Java.png" alt="Javaのアイコン">
        <p class="icon-discription">Java</p>
      </div>
      
      <div class="cast" data-name="Python">
        <img src="img/Python.png" alt="Pythonのアイコン">
        <p class="icon-discription">Python</p>
      </div>
      
      <div class="cast" data-name="Ruby">
        <img src="img/Ruby.png" alt="Rubyのアイコン">
        <p class="icon-discription">Ruby</p>
      </div>
    </div>
  </main>
  
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-botton">&times;</span>
      <div class="modal-body">
        <img id="modal-image" src="" alt="選択されたアイコン">
        <h2 id="modal-title"></h2>
        <p class="confirmation-message">このキャストに投票しますか？</p>
        <button id="vote-botton">投票する</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
